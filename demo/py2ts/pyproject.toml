[project]
name = "meshcall-demo-py2ts"
version = "0.1.0"
description = "A Python service with a generated TypeScript client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall",
    "pydantic>=2.11",
]

[project.scripts]
demo = "py2ts_demo.run:main"

[tool.uv.sources]
meshcall = { path = "../../meshcall-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py2ts_demo"]

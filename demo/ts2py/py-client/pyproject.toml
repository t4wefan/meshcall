[project]
name = "meshcall-demo-ts2py-client"
version = "0.1.0"
description = "Generated MeshCall Python client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall>=0.1.0",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcall_demo_ts2py_client"]

[tool.uv.sources]
meshcall = { path = "../../../meshcall-py" }

[tool.uv]
package = true

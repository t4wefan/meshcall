[project]
name = "meshcall"
version = "0.1.0"
description = "Async typed RPC for Python services: WebSocket direct or through the MeshCall Router"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "t4wefan" }]
requires-python = ">=3.11"
keywords = ["rpc", "websocket", "asyncio", "pydantic", "streaming", "router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.11",
    "websockets>=16.1",
]

[project.urls]
Homepage = "https://github.com/t4wefan/meshcall"
Changelog = "https://github.com/t4wefan/meshcall/blob/main/CHANGELOG.md"
Issues = "https://github.com/t4wefan/meshcall/issues"

[project.scripts]
meshcall = "meshcall.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Test fixtures are deliberately terse; test_diagnostics asserts the warnings.
filterwarnings = ["ignore::meshcall.diagnostics.MeshCallWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"
# The embedded agent skill is a verbatim copy of skills/meshcall/SKILL.md;
# reformatting its code blocks would make it drift from the source.
extend-exclude = ["src/meshcall/skills"]

[tool.pyright]
extraPaths = [
    "..",
    "../demo/quickstart/src",
    "../demo/py2ts/src",
    "../demo/showcase/src",
    "../demo/router/src",
    "../demo/ts2py/src",
    "../demo/ts2py/py-client/src",
]

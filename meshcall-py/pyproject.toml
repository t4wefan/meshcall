[project]
name = "meshcall"
version = "0.2.1"
description = "Async typed RPC for Python services: WebSocket direct or through the MeshCall Router"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "t4wefan" }]
requires-python = ">=3.11"
keywords = ["rpc", "websocket", "asyncio", "pydantic", "streaming", "router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.11",
    "websockets>=16.1",
]

[project.urls]
Homepage = "https://github.com/t4wefan/meshcall"
Changelog = "https://github.com/t4wefan/meshcall/blob/main/CHANGELOG.md"
Issues = "https://github.com/t4wefan/meshcall/issues"

[project.scripts]
meshcall = "meshcall.launcher:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.27",
    "pyright>=1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.custom]
# Platform wheels carry the Go binaries; see hatch_build.py.
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["src/meshcall/bin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test stuck this long dumps every thread's stack, so a hang in CI names
# its test instead of sitting silent until the job is cancelled.
faulthandler_timeout = 120
testpaths = ["tests"]
# Test fixtures are deliberately terse; test_diagnostics asserts the warnings.
filterwarnings = ["ignore::meshcall.diagnostics.MeshCallWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pyright]
extraPaths = [
    "..",
    "../demo/quickstart/src",
    "../demo/py2ts/src",
    "../demo/showcase/src",
    "../demo/router/src",
    "../demo/ts2py/src",
    "../demo/ts2py/py-client/src",
]

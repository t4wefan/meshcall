[project]
name = "meshcall-test-v1-greetingservice-client"
version = "0.1.0"
description = "Generated MeshCall Python client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall>=0.2.0",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcall_test_v1_greetingservice_client"]

[tool.uv]
package = true

[project]
name = "meshcall-best-practice-v1-llmservice-client"
version = "0.1.0"
description = "Generated MeshCall Python client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall>=0.3.0",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcall_best_practice_v1_llmservice_client"]

[tool.uv]
package = true

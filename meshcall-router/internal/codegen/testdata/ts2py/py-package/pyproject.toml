[project]
name = "meshcall-demo-v1-typescriptgreetingservice-client"
version = "0.1.0"
description = "Generated MeshCall Python client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall>=0.1.0",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcall_demo_v1_typescriptgreetingservice_client"]

[tool.uv]
package = true

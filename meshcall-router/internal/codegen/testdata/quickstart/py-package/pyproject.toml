[project]
name = "meshcall-example-v1-counterservice-client"
version = "0.1.0"
description = "Generated MeshCall Python client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall>=0.2.0",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcall_example_v1_counterservice_client"]

[tool.uv]
package = true

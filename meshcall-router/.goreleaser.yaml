version: 2

project_name: meshcall-router

before:
  hooks:
    - go mod tidy

builds:
  - id: meshcall-router
    main: ./cmd/meshcall-router
    binary: meshcall-router
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: meshcall
    main: ./cmd/meshcall
    binary: meshcall
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - ../LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: t4wefan
    name: meshcall
  draft: false
  prerelease: auto

changelog:
  disable: true

[project]
name = "meshcall-best-practice"
version = "0.1.0"
description = "An authenticated Go Router, Python LLM service, and TypeScript CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall",
    "pydantic>=2.11",
]

[project.scripts]
server = "best_practice.server:main"
init-router = "best_practice.init_router:main"
router-token = "best_practice.tokens:main"

[tool.uv.sources]
meshcall = { path = "../meshcall-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/best_practice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]

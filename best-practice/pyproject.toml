[project]
name = "meshcall-best-practice"
version = "0.1.0"
description = "A small Python LLM service with a TypeScript CLI client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meshcall",
    "pydantic>=2.11",
]

[project.scripts]
server = "best_practice.server:main"

[tool.uv.sources]
meshcall = { path = "../meshcall-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/best_practice"]

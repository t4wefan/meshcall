name: CI

on:
  push:
  pull_request:

env:
  MESHCALL_ROUTER_BINARY: ${{ github.workspace }}/meshcall-router/bin/meshcall-router

jobs:
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meshcall-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: meshcall-router/go.mod
          cache-dependency-path: meshcall-router/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: |
          go build -trimpath -ldflags="-X main.version=ci-${GITHUB_SHA::8}" -o bin/meshcall-router ./cmd/meshcall-router
          go build -trimpath -ldflags="-X main.version=ci-${GITHUB_SHA::8}" -o bin/meshcall ./cmd/meshcall
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: meshcall-router-linux
          path: |
            meshcall-router/bin/meshcall-router
            meshcall-router/bin/meshcall

  python:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meshcall-py
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY" "${MESHCALL_ROUTER_BINARY%/*}/meshcall"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests ../demo
      - run: uv run pyright src tests ../demo
      - run: uv run pytest -q

  demos:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY" "${MESHCALL_ROUTER_BINARY%/*}/meshcall"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv run --locked demo
        working-directory: demo/quickstart
      - run: uv run --locked demo
        working-directory: demo/py2ts
      - run: uv run --locked demo
        working-directory: demo/showcase
      - run: env -u MESHCALL_ROUTER_BINARY uv run --locked demo
        working-directory: demo/router
      - run: uv run --locked demo
        working-directory: demo/ts2py
      - name: Start Go from the installed TypeScript package
        working-directory: demo/ts2py/ts-server
        run: |
          env -u MESHCALL_ROUTER_BINARY node --input-type=module <<'JS'
          import { WebSocketRouter } from "meshcall";
          const router = new WebSocketRouter();
          try { await router.start(); } finally { await router.stop(); }
          JS

  typescript:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meshcall-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY" "${MESHCALL_ROUTER_BINARY%/*}/meshcall"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: meshcall-ts/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn run check
      - run: yarn test

  interop:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY" "${MESHCALL_ROUTER_BINARY%/*}/meshcall"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: meshcall-ts/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: meshcall-ts
      - run: uv sync --frozen
        working-directory: meshcall-py
      - run: uv run --no-sync pytest -q tests/test_multilang_interop.py
        working-directory: meshcall-py
        env:
          MESHCALL_RUN_INTEROP: "1"

  drift:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY" "${MESHCALL_ROUTER_BINARY%/*}/meshcall"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated clients match their generators
        run: scripts/regenerate.sh --check

  conformance:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: meshcall-router/go.mod
          cache-dependency-path: meshcall-router/go.sum
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: meshcall-ts/yarn.lock
      - name: Python and TypeScript runtimes pass the protocol conformance suite
        run: scripts/check.sh conformance

  windows:
    # Windows' local transport is a named pipe (#29): the Router, both
    # runtimes, interop and conformance all run here over a pipe and TCP.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MESHCALL_ROUTER_BINARY: ${{ github.workspace }}\meshcall-router\bin\meshcall-router.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: meshcall-router/go.mod
          cache-dependency-path: meshcall-router/go.sum
      - name: Go tests and binaries
        working-directory: meshcall-router
        run: |
          go vet ./...
          go test ./...
          go build -o bin/meshcall-router.exe ./cmd/meshcall-router
          go build -o bin/meshcall.exe ./cmd/meshcall
          go build -o bin/meshcall-conformance.exe ./cmd/meshcall-conformance
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: meshcall-ts/yarn.lock
      - run: yarn install --frozen-lockfile && yarn test
        working-directory: meshcall-ts
      - run: uv sync --frozen && uv run --no-sync pytest -q
        working-directory: meshcall-py
        env:
          MESHCALL_RUN_INTEROP: "1"
      - name: Conformance over a named pipe and over TCP
        run: |
          for transport in local tcp; do
            meshcall-router/bin/meshcall-conformance.exe --transport $transport \
              --fixture "uv run --project meshcall-py --locked python meshcall-py/conformance/fixture.py"
            meshcall-router/bin/meshcall-conformance.exe --transport $transport \
              --fixture "node meshcall-ts/dist/conformance/fixture.js"
          done

  packaging:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle the binaries the way a release does (one platform)
        run: |
          chmod +x meshcall-router/bin/meshcall-router meshcall-router/bin/meshcall
          version=$(cd meshcall-py && uv version --short)
          mkdir -p router-dist
          tar -czf "router-dist/meshcall-router_${version}_linux_amd64.tar.gz" -C meshcall-router/bin meshcall-router meshcall
          (cd meshcall-ts && yarn install --frozen-lockfile && yarn build)
          scripts/release/bundle.sh "$PWD/router-dist"
      - name: The platform wheel runs its bundled binaries without a download
        working-directory: meshcall-py
        run: |
          ls dist
          wheel=$(ls dist/meshcall-*-manylinux*.whl)
          uv run --isolated --no-project --with "$wheel" -- env -u MESHCALL_ROUTER_BINARY meshcall router path | grep -q "site-packages/meshcall/bin/meshcall-router"
          uv run --isolated --no-project --with "$wheel" -- env -u MESHCALL_ROUTER_BINARY meshcall version
          uv run --isolated --no-project --with dist/meshcall-*-py3-none-any.whl python -c "import meshcall, importlib.resources as r; assert r.files('meshcall').joinpath('py.typed').is_file(); print('pure wheel ok')"
      - name: npm tarballs
        working-directory: meshcall-ts
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q "dist/src/index.js" pack.log && grep -q "dist/src/launcher.js" pack.log
          grep -q '"meshcall-router-linux-x64"' package.json
          npm pack --dry-run ./dist-npm/meshcall-router-linux-x64 2>&1 | grep -q "bin/meshcall-router"
      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: meshcall-router
          args: check

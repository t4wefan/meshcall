name: CI

on:
  push:
  pull_request:

env:
  MESHCALL_ROUTER_BINARY: ${{ github.workspace }}/meshcall-router/bin/meshcall-router

jobs:
  router:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshcall-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: meshcall-router/go.mod
          cache-dependency-path: meshcall-router/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/meshcall-router ./cmd/meshcall-router
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: meshcall-router-linux
          path: meshcall-router/bin/meshcall-router

  python:
    needs: router
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshcall-py
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests ../demo
      - run: uv run pyright src tests ../demo
      - run: uv run pytest -q

  demos:
    needs: router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv run --locked demo
        working-directory: demo/quickstart
      - run: uv run --locked demo
        working-directory: demo/py2ts
      - run: uv run --locked demo
        working-directory: demo/showcase
      - run: env -u MESHCALL_ROUTER_BINARY uv run --locked demo
        working-directory: demo/router
      - run: uv run --locked demo
        working-directory: demo/ts2py
      - name: Start Go from the installed TypeScript package
        working-directory: demo/ts2py/ts-server
        run: |
          env -u MESHCALL_ROUTER_BINARY node --input-type=module <<'JS'
          import { WebSocketRouter } from "@meshcall/runtime";
          const router = new WebSocketRouter();
          try { await router.start(); } finally { await router.stop(); }
          JS

  typescript:
    needs: router
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshcall-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: meshcall-ts/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn run check
      - run: yarn test

  best-practice:
    needs: router
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            meshcall-ts/yarn.lock
            best-practice/ts-client/yarn.lock
      - run: yarn install --frozen-lockfile && yarn build
        working-directory: meshcall-ts
      - run: yarn install --frozen-lockfile && yarn run check && yarn build && yarn test
        working-directory: best-practice/ts-client
      - run: uv sync --frozen
        working-directory: best-practice
      - run: uv run ruff check src tests && uv run ruff format --check src tests && uv run pyright
        working-directory: best-practice
      - run: uv run --locked pytest -q
        working-directory: best-practice
        env:
          MESHCALL_RUN_INTEROP: "1"

  interop:
    needs: router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meshcall-router-linux
          path: ${{ github.workspace }}/meshcall-router/bin
      - run: chmod +x "$MESHCALL_ROUTER_BINARY"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: meshcall-ts/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: meshcall-ts
      - run: uv sync --frozen
        working-directory: meshcall-py
      - run: uv run --no-sync pytest -q tests/test_multilang_interop.py
        working-directory: meshcall-py
        env:
          MESHCALL_RUN_INTEROP: "1"

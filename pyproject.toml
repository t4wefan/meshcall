[project]
name = "meshcall"
version = "0.1.0"
description = "Async typed RPC for Python services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.11",
    "websockets>=15.0",
]

[project.scripts]
meshcall = "meshcall.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

